name: Deploy game to GitHub Pages

on:
  push:
    branches: [claude/galactic-command-code-review-7oka9v, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Deploys straight from dist/ without running the test suite (tests/ can still be run locally).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stamp each script and stylesheet with the commit so browsers load the new build at once
      # instead of serving cached files for up to 10 minutes.
      - name: Cache-bust assets
        run: sed -i -E 's/(src|href)="([a-z]+\.(js|css))"/\1="\2?v=${{ github.sha }}"/g' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
